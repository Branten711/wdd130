<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        
        #top {
            position: relative;
            display: block;
            overflow: hidden;
        }

        
        #title1, #title2 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 2;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.6);
            margin: 0;
            pointer-events: none;
        }
        #title1 { 
            top: 36px; 
            font-size: 2rem; 
        }
        #title2 { 
            top: 86px; 
            font-size: 1.25rem; 
        }

        
        #jesus {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: center;
            position: relative;
            z-index: 0;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5; 
            cursor: pointer;
        }

        
        #card {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            border: 10px solid #123e7a; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            position: relative;
        }
        #top { 
            background: transparent; 
        }
        #formContainer { 
            background: #fff; 
            padding: 28px 32px; 
        }
        #formContainer {
            display: block;
            margin-bottom: 6px;
        }
        #myForm {
            display: grid;
            grid-template-columns: 160px 1fr; 
            column-gap: 20px;
            row-gap: 12px;
            align-items: center;
            grid-auto-rows: auto;
        }

            
        #scriptures {
            display: flex;
            gap: 1px;
            justify-content: space-between;
            align-items: flex-end; 
            background: transparent;
        }

        #scriptures img {
            height: 100px;
            width: auto;
            object-fit: cover;
            display: block;
            
        }
        h3 {
            text-align: center;
            color: black;
            padding-bottom: 20px;
        }
        
        #formContainer form {
            gap: 12px;             
        }
        #formContainer label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        #myForm > div {
            display: flex;
            gap: 12px;
            align-items: center;
        }
      #myForm section {
          grid-column: 1/3;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          padding: 6px 0;
      }


    </style>




</head>

<body>

    <div id="card">
        <div id="top">
        <button type="button" id="closeBtn">X</button>

        <img id="jesus" src="images/jesus_feeds_5000.jpeg" alt="Jesus Feeds the 500">

        <h1 id="title1">Daily Feed</h1>
        <h1 id = "title2">Scripture a Day</h1>

        </div>
        <div id="formContainer">
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="subscribe">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="terms">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="sub">
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="scriptures">
            <img id="old" src="images/old_testament.webp" alt="old testament">
            <img id="new" src="images/new_testament.webp" alt="new testament">
            <img id="book" src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img id="doctrine" src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img id="pearl" src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">    
        </div>
    </div>

    <div id="output"></div>

    </div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
